<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d2b">
  <title>로그인 · 가락한상</title>
  <link rel="icon" href="assets/images/icon-192.png?v=4">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png?v=4">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="가락한상">
  <meta property="og:description" content="가락시장 30년 전통의 맛. 좋은 먹거리가 만나는 곳.">
  <meta property="og:image" content="https://garakmall.lexid.site/assets/brand/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://garakmall.lexid.site/assets/brand/og-image.jpg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="auth/login.css">
  <link rel="stylesheet" href="assets/css/brand.css">
  <script>window.GARAK_ROOT="";</script>
<link data-brand-v10="shop" rel="stylesheet" href="assets/css/garak-brand-v10.css"/><script data-brand-v10="shop" defer src="assets/js/garak-brand-v10.js"></script></head>
<body class="auth-page">
  <img class="brand-mascot-auth" src="assets/brand/mascot.webp?v=17" alt="가락한상 상인 캐릭터">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="index.html">
        <img class="brand-logo-img" src="assets/brand/wordmark.png" alt="가락한상" width="240" height="90">
      </a>
      <div id="loggedPanel" hidden class="auth-logged">
        <h1>로그인됨</h1>
        <p class="sub">Neon Auth 계정으로 로그인되었습니다. 장바구니·주문·쿠폰 상태는 마이페이지에서 확인하세요.</p>
        <p class="email" id="userEmail"></p>
        <a class="btn primary" href="mypage.html" style="display:block;text-align:center;padding:13px;margin:14px 0 8px">내 마이페이지 열기 →</a><button type="button" class="btn ghost" id="signOutBtn">로그아웃</button>
        <a class="auth-back" href="index.html">홈으로 이동 →</a>
      </div>
      <button type="button" class="google-btn" id="googleBtn">Google 계정으로 계속</button>
      <p class="auth-or">또는 이메일 계정</p>
      <form id="authForm">
        <h1>가락한상 로그인</h1>
        <p class="sub">Google 계정으로 가입하거나, 이메일 회원가입·로그인을 선택할 수 있습니다.</p>
        <div id="signupNameGroup" hidden><label for="signupName">회원 이름</label><input id="signupName" name="signupName" type="text" autocomplete="name" maxlength="50" placeholder="표시할 이름"></div>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="8자 이상">
        <button type="submit" class="btn primary" id="emailSubmit">이메일로 로그인</button><button type="button" class="btn ghost" id="signupToggle" style="display:block;width:100%;margin-top:8px;min-height:44px">새 계정 만들기</button>
        <p id="authMsg" class="auth-msg" role="status"></p>
        <p class="auth-note">Neon Auth 회원가입은 실제 인증 계정에 저장됩니다. 실결제·주문·배송은 별도로 연동됩니다.</p>
      </form>
      <a class="auth-back" href="index.html">← 쇼핑몰 홈</a>
    </div>
  </div>
  <script type="module" src="auth/login.mjs"></script>
</body>
</html>
