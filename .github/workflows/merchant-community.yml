name: Merchant community integration checks
on:
  pull_request:
    paths:
      - 'admin_core/merchant_community.py'
      - 'api/**'
      - 'storefront/merchant-showcase/**'
      - 'storefront/auth/**'
      - 'tests/test_merchant_community.py'
      - '.github/workflows/merchant-community.yml'
  push:
    branches: [main]
    paths:
      - 'admin_core/merchant_community.py'
      - 'api/**'
      - 'storefront/merchant-showcase/**'
      - 'tests/test_merchant_community.py'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Python source syntax
        run: python -m py_compile admin_core/merchant_community.py api/index.py tests/test_merchant_community.py
      - name: Python API tests
        run: python -m unittest discover -s tests -p 'test_merchant_community.py' -v
      - name: JavaScript syntax
        run: |
          node --check storefront/merchant-showcase/assets/merchant-online.mjs
          node --check storefront/merchant-showcase/assets/moderation.js
          node --check storefront/auth/login.mjs
          node --check storefront/auth/client.mjs
