<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123D2A">
  <title>로그인 · 가락한상</title>
  <link rel="icon" href="assets/images/icon-192.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="auth/login.css">
  <link rel="stylesheet" href="assets/css/brand.css">
  <script>window.GARAK_ROOT="";</script>
</head>
<body class="auth-page">
  <img class="brand-mascot-auth" src="assets/brand/mascot.webp" alt="가락한상 상인 캐릭터">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="index.html">
        <img class="brand-logo-img" src="assets/brand/logo-lockup.webp" alt="가락한상" width="240" height="90">
      </a>
      <div id="loggedPanel" hidden class="auth-logged">
        <h1>로그인됨</h1>
        <p class="sub">Google 계정으로 연결되었습니다. 장보기와 레시피는 시연 모드입니다.</p>
        <p class="email" id="userEmail"></p>
        <button type="button" class="btn primary" id="signOutBtn">로그아웃</button>
        <a class="auth-back" href="index.html">홈으로 이동 →</a>
      </div>
      <button type="button" class="google-btn" id="googleBtn">Google 계정으로 계속</button>
      <p class="auth-or">또는 이메일</p>
      <form id="authForm">
        <h1>가락한상 로그인</h1>
        <p class="sub">오늘도 맛있는 하루, 가락한상이 함께합니다. 고객 계정은 Neon Auth로 연결됩니다.</p>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="8자 이상">
        <button type="submit" class="btn primary">이메일로 로그인 / 가입</button>
        <p id="authMsg" class="auth-msg" role="status"></p>
        <p class="auth-note">Powered by Neon Managed Better Auth. 시연 서비스이며 실결제·실명 검증과 별개입니다.</p>
      </form>
      <a class="auth-back" href="index.html">← 쇼핑몰 홈</a>
    </div>
  </div>
  <script type="module" src="auth/login.mjs"></script>
</body>
</html>
