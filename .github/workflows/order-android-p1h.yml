name: Garak Hansang Android P1H - Verified v1.11 APK (GO-LIVE NO)

on:
  push:
    branches:
      - chatgpt/garakhansang-order-android-p1h-20261106
    paths:
      - android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
      - 'android-order-p1h/source-b64/**'
      - '.github/workflows/order-android-p1h.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble exact verified source ZIP from GitHub source chunks
        shell: bash
        run: |
          set -euo pipefail
          count="$(find android-order-p1h/source-b64 -maxdepth 1 -type f -name 'part-*.txt' | wc -l)"
          if test "$count" -ne 98; then echo "Expected 98 parts, got $count"; exit 1; fi
          cat android-order-p1h/source-b64/part-*.txt | base64 --decode > android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
          sha256sum android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact source ZIP and all 47 menu images
        run: |
          python3 android-order-p1h/tools/verify_source_archive.py \
            --archive android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip \
            --extract-dir "$RUNNER_TEMP/garak-p1h-app"
      - name: Verify v1.11 source, media and demo-only restrictions
        working-directory: ${{ runner.temp }}/garak-p1h-app
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 tools/qa_v21_static.py
          python3 -m pytest -q \
            tests/test_mobile_p1.py tests/test_mobile_p16_catalog.py \
            tests/test_mobile_p17_auth.py tests/test_mobile_p18_assetlinks.py \
            tests/test_mobile_p19_apk_gate.py tests/test_mobile_p19_emulator_gate.py \
            tests/test_mobile_p1g_regressions.py tests/test_mobile_p1h_security.py
      - name: Run Java PKCE OAuth and catalog search checks
        working-directory: ${{ runner.temp }}/garak-p1h-app
        run: |
          mkdir -p "$RUNNER_TEMP/garak-p1h-jvm"
          javac -d "$RUNNER_TEMP/garak-p1h-jvm" app/src/main/java/site/lexid/garakhansang/order/OAuthPkce.java tests/jvm/OAuthPkceSelfTest.java
          javac -cp "$RUNNER_TEMP/garak-p1h-jvm" -d "$RUNNER_TEMP/garak-p1h-jvm" app/src/main/java/site/lexid/garakhansang/order/OAuthCodeExchange.java app/src/main/java/site/lexid/garakhansang/order/OAuthLoginFlow.java tests/jvm/OAuthExchangeSelfTest.java tests/jvm/OAuthLoginFlowSelfTest.java
          javac -cp "$RUNNER_TEMP/garak-p1h-jvm" -d "$RUNNER_TEMP/garak-p1h-jvm" app/src/main/java/site/lexid/garakhansang/order/CatalogFilters.java tests/jvm/CatalogFiltersSelfTest.java
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" OAuthPkceSelfTest
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" OAuthExchangeSelfTest
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" OAuthLoginFlowSelfTest
          javac -cp "$RUNNER_TEMP/garak-p1h-jvm" -d "$RUNNER_TEMP/garak-p1h-jvm" app/src/main/java/site/lexid/garakhansang/order/HttpResponseGuards.java tests/jvm/HttpResponseGuardsSelfTest.java
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" CatalogFiltersSelfTest
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" HttpResponseGuardsSelfTest
      - name: Re-test the original V5 backend
        working-directory: ${{ runner.temp }}/garak-p1h-app
        run: |
          python3 -m pip install -r _v5_verify/GARAK_HANSANG_ORDER_V5/requirements-v5.txt
          python3 -m unittest discover -s _v5_verify/GARAK_HANSANG_ORDER_V5/tests -p 'test*.py' -q
      - name: Prepare Android SDK 36
        run: |
          SDKMGR="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build real native APK
        working-directory: ${{ runner.temp }}/garak-p1h-app
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK signature, applicationId and version 21
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/garak-p1h-app/app/build/outputs/apk/debug/app-debug.apk" dist/GarakHansang-Order-v111-debug.apk
          python3 "$RUNNER_TEMP/garak-p1h-app/tools/verify_debug_apk.py" \
            --apk dist/GarakHansang-Order-v111-debug.apk \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --receipt dist/debug-apk-verified.json
          sha256sum dist/GarakHansang-Order-v111-debug.apk > dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GarakHansang-Order-v111-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    needs: build-signed-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble exact verified source ZIP from GitHub source chunks
        shell: bash
        run: |
          set -euo pipefail
          count="$(find android-order-p1h/source-b64 -maxdepth 1 -type f -name 'part-*.txt' | wc -l)"
          if test "$count" -ne 98; then echo "Expected 98 parts, got $count"; exit 1; fi
          cat android-order-p1h/source-b64/part-*.txt | base64 --decode > android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
          sha256sum android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and extract source for smoke script
        run: |
          python3 android-order-p1h/tools/verify_source_archive.py \
            --archive android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip \
            --extract-dir "$RUNNER_TEMP/garak-p1h-app"
      - uses: actions/download-artifact@v4
        with:
          name: GarakHansang-Order-v111-debug-apk
          path: dist
      - name: Check real APK exists
        run: test -s dist/GarakHansang-Order-v111-debug.apk
      - name: Enable KVM when available
        run: if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Install, launch and navigate on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 "$RUNNER_TEMP/garak-p1h-app/tools/emulator_smoke.py" --apk "$GITHUB_WORKSPACE/dist/GarakHansang-Order-v111-debug.apk" --out "$GITHUB_WORKSPACE/smoke-evidence" || { adb shell am start -W -n site.lexid.garakhansang.order/.MainActivity; adb logcat -d -v brief | grep -E 'AndroidRuntime|FATAL EXCEPTION|Process.*site\.lexid\.garakhansang|site\.lexid\.garakhansang|ActivityTaskManager|ActivityManager|ClassNotFoundException|NoClassDefFoundError|Fatal signal' | tail -n 130; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GarakHansang-Order-v111-emulator-evidence
          path: smoke-evidence/
          if-no-files-found: ignore
          retention-days: 14
