name: Garak Hansang Android P1H - strict HTTP/OAuth source CI (No APK)
on:
  push:
    branches:
      - chatgpt/garakhansang-order-android-p1h-20261106
    paths:
      - 'android-order-p1f/src/**'
      - '.github/workflows/order-android-p1h-source-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: android-order-p1f/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify disabled production functions and P1H version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("app/build.gradle.kts").read_text()
          assert "versionCode = 21" in p and "1.11.0-p1h-http-safety-demo" in p
          config=json.loads(Path("app/src/main/assets/mobile_api_config.json").read_text())
          assert config["enabled"] is False and config["oauth_enabled"] is False
          items=json.loads(Path("catalog/menus_47.json").read_text())["items"]
          assert len(items)==47 and all(row["is_orderable"] is False for row in items)
          assert Path("app/src/main/java/site/lexid/garakhansang/order/HttpResponseGuards.java").exists()
          print("P1H safety gates and 47 demo-only catalog entries validated")
          PY
      - name: Install contract test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run 56 offline Python contract/regression checks
        run: |
          python3 -m pytest -q \
            tests/test_mobile_p1.py tests/test_mobile_p16_catalog.py \
            tests/test_mobile_p17_auth.py tests/test_mobile_p18_assetlinks.py \
            tests/test_mobile_p19_apk_gate.py tests/test_mobile_p19_emulator_gate.py \
            tests/test_mobile_p1g_regressions.py tests/test_mobile_p1h_security.py
      - name: Run 102 offline Java OAuth, catalog and MIME checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p1h-jvm"
          javac -d "$RUNNER_TEMP/p1h-jvm" \
            app/src/main/java/site/lexid/garakhansang/order/OAuthPkce.java \
            app/src/main/java/site/lexid/garakhansang/order/OAuthCodeExchange.java \
            app/src/main/java/site/lexid/garakhansang/order/OAuthLoginFlow.java \
            app/src/main/java/site/lexid/garakhansang/order/CatalogFilters.java \
            app/src/main/java/site/lexid/garakhansang/order/HttpResponseGuards.java \
            tests/jvm/OAuthPkceSelfTest.java \
            tests/jvm/OAuthExchangeSelfTest.java \
            tests/jvm/OAuthLoginFlowSelfTest.java \
            tests/jvm/CatalogFiltersSelfTest.java \
            tests/jvm/HttpResponseGuardsSelfTest.java
          for test in OAuthPkceSelfTest OAuthExchangeSelfTest OAuthLoginFlowSelfTest CatalogFiltersSelfTest HttpResponseGuardsSelfTest; do
            java -cp "$RUNNER_TEMP/p1h-jvm" "$test"
          done
      - name: Honest build status
        run: echo "Source CI succeeded. No Android APK, verified App Link, Google E2E, or real order/payment tested."
