name: Garak Hansang Android P5 Verified Native Catalog LAB - debug APK (GO-LIVE NO)

on:
  push:
    branches:
      - chatgpt/garakhansang-order-p2-stripe-sandbox-roles-20261107
    paths:
      - android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
      - 'android-order-p1h/source-b64/**'
      - '.github/workflows/order-android-p2-nav-lab.yml'
      - 'android-order-p1h/hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble exact verified source ZIP from GitHub source chunks
        shell: bash
        run: |
          set -euo pipefail
          count="$(find android-order-p1h/source-b64 -maxdepth 1 -type f -name 'part-*.txt' | wc -l)"
          if test "$count" -ne 98; then echo "Expected 98 parts, got $count"; exit 1; fi
          cat android-order-p1h/source-b64/part-*.txt | base64 --decode > android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
          sha256sum android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact source ZIP and all 47 menu images
        run: |
          python3 android-order-p1h/tools/verify_source_archive.py \
            --archive android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip \
            --extract-dir "$RUNNER_TEMP/garak-p1h-app"
      - name: Apply SHA-verified Android 15 launch hotfix after original ZIP verification
        shell: bash
        run: |
          set -euo pipefail
          APP_MAIN="$RUNNER_TEMP/garak-p1h-app/app/src/main/java/site/lexid/garakhansang/order/MainActivity.java"
          test "$(sha256sum "$APP_MAIN" | cut -d' ' -f1)" = "d57d38a684d0d2716125ef03f2d47e2af0a48d89d78a192ca14825818f91f448"
          cp android-order-p1h/hotfix/MainActivity.java "$APP_MAIN"
          cp android-order-p1h/hotfix/LiveCatalogClient.java "$(dirname "$APP_MAIN")/LiveCatalogClient.java"
          grep -q 'verifiedCatalogPage' "$APP_MAIN"
          grep -q 'live_catalog' "$APP_MAIN"
          grep -q 'https://garakmall.lexid.site/api/mobile/v1/catalog' "$(dirname "$APP_MAIN")/LiveCatalogClient.java"
          grep -q 'openMarketDirections' "$APP_MAIN"
          grep -q 'www.google.com/maps/dir/' "$APP_MAIN"
          echo "P2 reviewed Garakland navigation fallback patch applied; original ZIP was SHA-verified."
      - name: Verify v1.11 source, media and demo-only restrictions
        working-directory: ${{ runner.temp }}/garak-p1h-app
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 tools/qa_v21_static.py
          python3 -m pytest -q \
            tests/test_mobile_p1.py tests/test_mobile_p16_catalog.py \
            tests/test_mobile_p17_auth.py tests/test_mobile_p18_assetlinks.py \
            tests/test_mobile_p19_apk_gate.py tests/test_mobile_p19_emulator_gate.py \
            tests/test_mobile_p1g_regressions.py tests/test_mobile_p1h_security.py
      - name: Verify mobile commerce read-only API contracts
        run: python3 -m unittest discover -s tests -p 'test_mobile_commerce_contract.py' -q
      - name: Verify merchant and rider order-state domain
        run: python3 -m unittest discover -s tests -p 'test_delivery_flow.py' -q
      - name: Run Java PKCE OAuth and catalog search checks
        working-directory: ${{ runner.temp }}/garak-p1h-app
        run: |
          mkdir -p "$RUNNER_TEMP/garak-p1h-jvm"
          javac -d "$RUNNER_TEMP/garak-p1h-jvm" app/src/main/java/site/lexid/garakhansang/order/OAuthPkce.java tests/jvm/OAuthPkceSelfTest.java
          javac -cp "$RUNNER_TEMP/garak-p1h-jvm" -d "$RUNNER_TEMP/garak-p1h-jvm" app/src/main/java/site/lexid/garakhansang/order/OAuthCodeExchange.java app/src/main/java/site/lexid/garakhansang/order/OAuthLoginFlow.java tests/jvm/OAuthExchangeSelfTest.java tests/jvm/OAuthLoginFlowSelfTest.java
          javac -cp "$RUNNER_TEMP/garak-p1h-jvm" -d "$RUNNER_TEMP/garak-p1h-jvm" app/src/main/java/site/lexid/garakhansang/order/CatalogFilters.java tests/jvm/CatalogFiltersSelfTest.java
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" OAuthPkceSelfTest
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" OAuthExchangeSelfTest
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" OAuthLoginFlowSelfTest
          javac -cp "$RUNNER_TEMP/garak-p1h-jvm" -d "$RUNNER_TEMP/garak-p1h-jvm" app/src/main/java/site/lexid/garakhansang/order/HttpResponseGuards.java tests/jvm/HttpResponseGuardsSelfTest.java
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" CatalogFiltersSelfTest
          java -cp "$RUNNER_TEMP/garak-p1h-jvm" HttpResponseGuardsSelfTest
      - name: Re-test the original V5 backend
        working-directory: ${{ runner.temp }}/garak-p1h-app
        run: |
          python3 -m pip install -r _v5_verify/GARAK_HANSANG_ORDER_V5/requirements-v5.txt
          python3 -m unittest discover -s _v5_verify/GARAK_HANSANG_ORDER_V5/tests -p 'test*.py' -q
      - name: Prepare Android SDK 36
        run: |
          SDKMGR="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure isolated installable LAB package (preserve original app and data)
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/garak-p1h-app" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          gradle=root/"app/build.gradle.kts"
          source=gradle.read_text(encoding="utf-8")
          a='applicationId = "site.lexid.garakhansang.order"'
          b='applicationId = "site.lexid.garakhansang.order.lab"'
          assert source.count(a)==1
          gradle.write_text(source.replace(a,b),encoding="utf-8")
          manifest=root/"app/src/main/AndroidManifest.xml"
          source=manifest.read_text(encoding="utf-8")
          assert source.count('android:label="가락한상 오더"')==1
          manifest.write_text(source.replace('android:label="가락한상 오더"',
                                              'android:label="가락한상 오더 TEST"'),encoding="utf-8")
          verifier=root/"tools/verify_debug_apk.py"
          source=verifier.read_text(encoding="utf-8")
          assert source.count("PACKAGE = 'site.lexid.garakhansang.order'")==1
          verifier.write_text(source.replace("PACKAGE = 'site.lexid.garakhansang.order'",
                                             "PACKAGE = 'site.lexid.garakhansang.order.lab'"),encoding="utf-8")
          smoke=root/"tools/emulator_smoke.py"
          source=smoke.read_text(encoding="utf-8")
          assert "PACKAGE='site.lexid.garakhansang.order'" in source
          assert "ACTIVITY=PACKAGE+'/.MainActivity'" in source
          smoke.write_text(source.replace(
             "PACKAGE='site.lexid.garakhansang.order'",
             "PACKAGE='site.lexid.garakhansang.order.lab'"
          ).replace(
             "ACTIVITY=PACKAGE+'/.MainActivity'",
             "ACTIVITY=PACKAGE+'/site.lexid.garakhansang.order.MainActivity'"
          ),encoding="utf-8")
          print("Isolated Android appId suffix .lab and TEST display label configured.")
          PY
      - name: Confirm shared production website live approved catalog API (safe to be empty)
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'https://garakmall.lexid.site/api/mobile/v1/catalog' android-order-p1h/hotfix/LiveCatalogClient.java)" -ge 1
          curl -fSsL --retry 2 --retry-delay 1 --max-time 25 -H 'Accept: application/json'             https://garakmall.lexid.site/api/mobile/v1/catalog -o "$RUNNER_TEMP/garak-approved-catalog.json"
          python3 - "$RUNNER_TEMP/garak-approved-catalog.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as stream:
              catalog=json.load(stream)
          assert catalog['schema_version']==1
          assert catalog['source']=='verified_neon_release_ready'
          assert catalog['order_service_ready'] is False
          assert catalog['delivery_tracking_ready'] is False
          assert isinstance(catalog['items'],list)
          assert all(p.get('merchant_verified') is True and not p.get('can_checkout') for p in catalog['items'])
          print('Verified live garakmall.lexid.site approved catalog contract; approved product count:',len(catalog['items']))
          PY
      - name: Build real native APK
        working-directory: ${{ runner.temp }}/garak-p1h-app
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK signature, applicationId and version 21
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/garak-p1h-app/app/build/outputs/apk/debug/app-debug.apk" dist/GarakHansang-Order-P5-LiveCatalog-Lab-v111-debug.apk
          python3 "$RUNNER_TEMP/garak-p1h-app/tools/verify_debug_apk.py" \
            --apk dist/GarakHansang-Order-P5-LiveCatalog-Lab-v111-debug.apk \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --receipt dist/debug-apk-verified.json
          sha256sum dist/GarakHansang-Order-P5-LiveCatalog-Lab-v111-debug.apk > dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GarakHansang-Order-P5-LiveCatalog-Lab-v111-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    strategy:
      fail-fast: false
      matrix:
        android_api: [35, 36]
    needs: build-signed-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble exact verified source ZIP from GitHub source chunks
        shell: bash
        run: |
          set -euo pipefail
          count="$(find android-order-p1h/source-b64 -maxdepth 1 -type f -name 'part-*.txt' | wc -l)"
          if test "$count" -ne 98; then echo "Expected 98 parts, got $count"; exit 1; fi
          cat android-order-p1h/source-b64/part-*.txt | base64 --decode > android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
          sha256sum android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and extract source for smoke script
        run: |
          python3 android-order-p1h/tools/verify_source_archive.py \
            --archive android-order-p1h/GarakHansang_Order_Android_v1_11_P1H_Source_20261106.zip \
            --extract-dir "$RUNNER_TEMP/garak-p1h-app"
      - uses: actions/download-artifact@v4
        with:
          name: GarakHansang-Order-P5-LiveCatalog-Lab-v111-debug-apk
          path: dist
      - name: Check real APK exists
        run: test -s dist/GarakHansang-Order-P5-LiveCatalog-Lab-v111-debug.apk
      - name: Enable KVM when available
        run: if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Adapt emulator test scripts to isolated LAB package id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/order-lab-smoke"
          cp android-order-p1h/hotfix/emulator_smoke_p1j.py "$RUNNER_TEMP/order-lab-smoke/"
          cp android-order-p1h/hotfix/emulator_smoke_p5.py "$RUNNER_TEMP/order-lab-smoke/"
          cp android-order-p1h/hotfix/emulator_legacy_prefs.py "$RUNNER_TEMP/order-lab-smoke/"
          python3 - "$RUNNER_TEMP/order-lab-smoke" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          smoke=root/"emulator_smoke_p1j.py"
          s=smoke.read_text(encoding="utf-8")
          assert "P='site.lexid.garakhansang.order'" in s
          assert "P+'/.MainActivity'" in s
          s=s.replace("P='site.lexid.garakhansang.order'",
                      "P='site.lexid.garakhansang.order.lab'")
          s=s.replace("P+'/.MainActivity'",
                      "P+'/site.lexid.garakhansang.order.MainActivity'")
          # Android 16 may show quantity control before the CTA enters the viewport.
          # Scroll on subsequent strict assertion attempts; never pretend success.
          missing="  observed.append('missing '+expected+' from '+str(len(elements))+' elements')"
          assert missing in s
          retry="  if name=='product_detail_scrolled' and attempt<7:\n   adb('shell','input','swipe','525','1650','525','480','350')\n"
          s=s.replace(missing,retry+missing)
          smoke.write_text(s,encoding="utf-8")
          legacy=root/"emulator_legacy_prefs.py"
          s=legacy.read_text(encoding="utf-8")
          assert "P + '/.MainActivity'" in s
          s=s.replace("P + '/.MainActivity'",
                      "P + '/site.lexid.garakhansang.order.MainActivity'")
          legacy.write_text(s,encoding="utf-8")
          print("Isolated LAB smoke and legacy preference launch target verified.")
          PY
      - name: Install, launch and navigate on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.android_api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            python3 "$RUNNER_TEMP/order-lab-smoke/emulator_smoke_p5.py" --apk "$GITHUB_WORKSPACE/dist/GarakHansang-Order-P5-LiveCatalog-Lab-v111-debug.apk" --out "$GITHUB_WORKSPACE/smoke-evidence" || { adb logcat -d -v brief | grep -E 'AndroidRuntime|FATAL EXCEPTION|site\\.lexid\\.garakhansang' | tail -n 150; exit 1; }
            python3 "$RUNNER_TEMP/order-lab-smoke/emulator_legacy_prefs.py" --out "$GITHUB_WORKSPACE/smoke-evidence" || { adb logcat -d -v brief | grep -E 'AndroidRuntime|FATAL EXCEPTION|site\\.lexid\\.garakhansang' | tail -n 150; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GarakHansang-Order-P5-LiveCatalog-Lab-v111-emulator-evidence-api${{ matrix.android_api }}
          path: smoke-evidence/
          if-no-files-found: ignore
          retention-days: 14
