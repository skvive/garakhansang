name: Garak Hansang Order iOS P5 - verified live catalog and native five-screen simulator QA
on:
  push:
    branches:
      - chatgpt/garakhansang-order-ios-p4-navigation-qa-20261107
    paths:
      - 'ios-order/**'
      - '.github/workflows/garakhansang-ios-p4-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios-simulator:
    name: Verify sources and build unsigned iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore exact archived iOS source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, os, stat, zipfile, io
          chunks=sorted(Path("ios-order/source-b64").glob("part-*.txt"))
          assert len(chunks)==52, "Expected exactly 52 encoded source chunks"
          for i, f in enumerate(chunks):
              assert f.name == f"part-{i:03d}.txt"
          encoded="".join(f.read_text(encoding="ascii") for f in chunks)
          assert len(encoded)==6762668
          data=base64.b64decode(encoded, validate=True)
          expected="02c9094a36edc7f7da06ce0a14c7ccd8982da3537d394f14f1865f1c425facd1"
          assert len(data)==5072001 and hashlib.sha256(data).hexdigest()==expected, "ZIP byte count/hash mismatch"
          path=Path(os.environ["RUNNER_TEMP"])/"garak-ios-source"
          path.mkdir(exist_ok=True)
          z=zipfile.ZipFile(io.BytesIO(data))
          members=z.infolist()
          assert len(members)==63 and z.testzip() is None, "ZIP missing or damaged"
          for member in members:
              p=PurePosixPath(member.filename)
              assert not p.is_absolute() and ".." not in p.parts, "Unsafe ZIP path"
              assert stat.S_IFMT(member.external_attr>>16)!=stat.S_IFLNK, "ZIP symlink not allowed"
          z.extractall(path)
          old_folder=path/"GarakHansangOrder/Resources"
          assert old_folder.is_dir(), "Original resource folder missing"
          old_folder.rename(path/"GarakHansangOrder/GHSContent")
          print("Migrated iOS bundle resources to non-reserved GHSContent directory")
          assert (path/"GarakHansangOrder.xcodeproj/project.pbxproj").is_file()
          print("Verified exact iOS archive",len(data),"bytes,",len(members),"files")
          PY
          cp ios-order/Sources/*.swift "$RUNNER_TEMP/garak-ios-source/GarakHansangOrder/Sources/"
          cp ios-order/project.pbxproj "$RUNNER_TEMP/garak-ios-source/GarakHansangOrder.xcodeproj/project.pbxproj"
      - name: Validate offline catalog and 47 image hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"garak-ios-source"
          p=root/"GarakHansangOrder/GHSContent"
          source=json.loads((root/"SOURCE_PROVENANCE.json").read_text())
          data=(p/"Catalog/menus_47.json").read_bytes()
          assert hashlib.sha256(data).hexdigest()==source["catalog_sha256"]
          items=json.loads(data)["items"]
          assert len(items)==47 and len(set(x["id"] for x in items))==47
          assert len(set(x["category"] for x in items))==12
          assert all(x["is_orderable"] is False and x["image_is_ai_concept"] is True and x["catalog_visibility"]=="needs_merchandising_approval" for x in items)
          names=set(x["image"] for x in items)
          assert names==set(source["menu_image_sha256"])
          for name,expect in source["menu_image_sha256"].items():
              assert hashlib.sha256((p/"MenuImages"/name).read_bytes()).hexdigest()==expect
          print("Verified 47 original images and demo-only product safety")
          PY
          plutil -lint "$RUNNER_TEMP/garak-ios-source/GarakHansangOrder.xcodeproj/project.pbxproj"
      - name: Verify first-party Swift navigation boundary checks
        shell: bash
        run: |
          set -euo pipefail
          swiftc ios-order/Sources/VerifiedMarketNavigation.swift ios-order/Tests/VerifiedMarketNavigationTests.swift -o "$RUNNER_TEMP/garak-ios-navigation-tests"
          "$RUNNER_TEMP/garak-ios-navigation-tests"
          swiftc ios-order/Sources/VerifiedCatalogModels.swift ios-order/Tests/VerifiedCatalogModelsTests.swift -o "$RUNNER_TEMP/garak-ios-catalog-policy"
          "$RUNNER_TEMP/garak-ios-catalog-policy"
          xcrun swiftc -frontend -parse ios-order/Sources/*.swift
          grep -q 'VerifiedLiveCatalogScreen' ios-order/Sources/MainViews.swift
          grep -q 'VerifiedLiveCartSection' ios-order/Sources/MainViews.swift
          grep -q 'VerifiedDeliveryStatusScreen' ios-order/Sources/MainViews.swift
          grep -q '30_000_000_000' ios-order/Sources/MainViews.swift
      - name: Verify live homepage approved merchant API is reachable from macOS before iPhone QA
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://garakmall.lexid.site/api/mobile/v1/catalog' ios-order/Sources/VerifiedLiveCommerce.swift
          curl -fSsL --retry 2 --retry-delay 1 --max-time 25             https://garakmall.lexid.site/api/mobile/v1/catalog -o "$RUNNER_TEMP/native-ios-catalog.json"
          python3 - "$RUNNER_TEMP/native-ios-catalog.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding='utf-8'))
          assert payload['schema_version']==1
          assert payload['source']=='verified_neon_release_ready'
          assert not payload['order_service_ready']
          assert not payload['delivery_tracking_ready']
          assert isinstance(payload['items'],list)
          print('iPhone source and production website share one verified Neon catalog:',len(payload['items']),'approved items')
          PY
      - name: Show Xcode and project schemes
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -list -project "$RUNNER_TEMP/garak-ios-source/GarakHansangOrder.xcodeproj"
      - name: Compile and link actual SwiftUI iOS Simulator app (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$RUNNER_TEMP/garak-ios-source/GarakHansangOrder.xcodeproj" \
            -scheme GarakHansangOrder -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/garak-ios-derived" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/garak-ios-build.log"
      - name: Verify built .app assets and app bundle identifier
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/garak-ios-derived/Build/Products/Debug-iphonesimulator/GarakHansangOrder.app"
          test -d "$APP"
          test -f "$APP/GHSContent/Catalog/menus_47.json"
          test ! -d "$APP/Resources"
          test "$(find "$APP/GHSContent/MenuImages" -type f -name 'menu_*.jpg' | wc -l | tr -d ' ')" = 47
          test -f "$APP/GHSContent/Brand/garakhansang-logo.png"
          IDENTIFIER="$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"
          test "$IDENTIFIER" = 'site.lexid.garakhansang.order.ios'
          # Ad-hoc signing for Simulator only; no Apple Developer provisioning or release IPA.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent "$APP" output/GarakHansangOrder-P5-Simulator.app.zip
          shasum -a 256 output/GarakHansangOrder-P5-Simulator.app.zip > output/SHA256.txt
          echo "Bundle id: $IDENTIFIER; version: $(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" > output/build_receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GarakHansangOrder-iOS-P5-Simulator-App
          path: output/
          retention-days: 30
          if-no-files-found: error

  simulator-launch-smoke:
    name: Install and launch on iPhone Simulator
    needs: build-ios-simulator
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GarakHansangOrder-iOS-P5-Simulator-App
          path: download
      - name: Unpack signed-free simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked screenshots
          ditto -x -k download/GarakHansangOrder-P5-Simulator.app.zip unpacked
          test -d unpacked/GarakHansangOrder.app
          test -f unpacked/GarakHansangOrder.app/Info.plist
          plutil -lint unpacked/GarakHansangOrder.app/Info.plist
          test "$(plutil -extract CFBundleIdentifier raw unpacked/GarakHansangOrder.app/Info.plist)" = 'site.lexid.garakhansang.order.ios'
          codesign --verify --deep --strict unpacked/GarakHansangOrder.app
      - name: Install, launch and take iPhone Simulator screenshot
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","-j","devices","available"]))
          phones=[device for devices in data["devices"].values() for device in devices if "iPhone" in device["name"] and device.get("isAvailable", True)]
          print(phones[0]["udid"] if phones else "")
          PY
          )"
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" unpacked/GarakHansangOrder.app
          for test_tab in 0 1 2 3 4; do
            case "$test_tab" in
              0) label=home ;; 1) label=menu ;; 2) label=cart ;;
              3) label=orders ;; 4) label=mine ;;
            esac
            SIMCTL_CHILD_GHS_QA_TAB="$test_tab" xcrun simctl launch --terminate-running-process "$UDID" site.lexid.garakhansang.order.ios
            # The first launch may display a white splash while large bundled
            # catalog images initialize. Never treat that blank frame as a pass.
            for capture_attempt in 1 2 3 4 5 6; do
              sleep 5
              xcrun simctl io "$UDID" screenshot "screenshots/ios-$label.png"
              bytes="$(stat -f%z "screenshots/ios-$label.png")"
              threshold=100000
              if test "$label" = home; then threshold=160000; fi
              if test "$label" = menu; then threshold=350000; fi
              if test "$bytes" -gt "$threshold"; then break; fi
              echo "UI has not rendered complete $label; screenshot is $bytes bytes (attempt $capture_attempt)"
            done
            test "$(stat -f%z "screenshots/ios-$label.png")" -gt "$threshold"
          done
          python3 - <<'PY'
          from pathlib import Path
          import struct,hashlib
          shots=sorted(Path("screenshots").glob("ios-*.png"))
          assert len(shots)==5
          sizes=set()
          for shot in shots:
              b=shot.read_bytes()
              assert b[:8]==bytes.fromhex("89504e470d0a1a0a"),f"{shot} not PNG"
              w,h=struct.unpack(">II",b[16:24])
              assert w>=300 and h>=600, (shot,w,h)
              sizes.add((w,h))
              print("PASS",shot,w,h,hashlib.sha256(b).hexdigest()[:16])
          assert len(sizes)==1, "Simulator screen dimensions must match"
          PY
          echo "All five native iPhone tab screenshots captured; simulator-only QA, not real-device App Store deployment." > screenshots/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GarakHansangOrder-iOS-P5-Five-Screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore
