name: GHO V5 auth & RLS tests
on:
  push:
    branches: ['chatgpt/garakhansang-order-v5-*']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/order-v5/requirements-v5.txt
      - working-directory: services/order-v5
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - run: python -m compileall -q services/order-v5/backend
