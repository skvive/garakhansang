name: Merchant community API security checks
on:
  pull_request:
    branches: [main]
    paths: ['admin_core/merchant_community.py','api/index.py','api/requirements.txt','tests/test_merchant_community.py','.github/workflows/merchant-community.yml']
  push:
    branches: [main]
    paths: ['admin_core/merchant_community.py','api/index.py','api/requirements.txt','tests/test_merchant_community.py','.github/workflows/merchant-community.yml']
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Security regression tests
        run: python -m unittest discover -s tests -p test_merchant_community.py -v
