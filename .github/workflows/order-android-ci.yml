name: Garak Hansang Order Android Debug APK
on:
  push:
    branches: ['chatgpt/garakhansang-order-android-20261102']
    paths: ['android-order/**', '.github/workflows/order-android-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -x "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build actual debug APK
        working-directory: android-order
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Inspect APK
        run: |
          test -s android-order/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android-order/app/build/outputs/apk/debug/app-debug.apk | head -20
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android-order/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-order/app/build/outputs/apk/debug/app-debug.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GarakHansang-Order-debug-apk
          path: |
            android-order/app/build/outputs/apk/debug/app-debug.apk
            SHA256.txt
          retention-days: 30

  emulator-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GarakHansang-Order-debug-apk
      - name: Enable KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Install, launch and inspect on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r android-order/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n site.lexid.garakhansang.order/.MainActivity
            sleep 8
            adb shell pidof site.lexid.garakhansang.order
            adb shell screencap -p /sdcard/garakhansang-home.png
            adb pull /sdcard/garakhansang-home.png smoke-home.png
            adb shell uiautomator dump /sdcard/garakhansang-window.xml
            adb pull /sdcard/garakhansang-window.xml smoke-window.xml
            grep -q '가락한상 오더' smoke-window.xml
            adb shell input tap 320 2250
            sleep 2
            adb shell screencap -p /sdcard/products.png
            adb pull /sdcard/products.png smoke-products.png
            adb shell uiautomator dump /sdcard/products.xml
            adb pull /sdcard/products.xml smoke-products.xml
            grep -q '상품 탐색' smoke-products.xml
            adb shell input tap 665 2250
            sleep 2
            adb shell screencap -p /sdcard/cart.png
            adb pull /sdcard/cart.png smoke-cart.png
            adb shell uiautomator dump /sdcard/cart.xml
            adb pull /sdcard/cart.xml smoke-cart.xml
            grep -q '장바구니' smoke-cart.xml
            adb shell input tap 945 2250
            sleep 2
            adb shell screencap -p /sdcard/info.png
            adb pull /sdcard/info.png smoke-info.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GarakHansang-Order-emulator-smoke
          path: |
            smoke-*.png
            smoke-*.xml
          if-no-files-found: ignore
          retention-days: 14
